<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CorpusToWords</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="min-h-screen bg-zinc-950 font-['Roboto_Mono',ui-monospace,monospace] text-zinc-300 antialiased selection:bg-amber-500/30"
  >
    <div class="mx-auto flex min-h-screen max-w-6xl flex-col px-6 py-12">
      <header class="mb-8">
        <h1 class="text-sm font-medium uppercase tracking-[0.2em] text-zinc-500">
          CorpusToWords
        </h1>
        <p class="mt-1 text-xs text-zinc-600">
          Paste or load text, normalize it, and export a frequency-filtered word list
        </p>
      </header>

      <main class="flex flex-1 flex-col gap-6">
        <div class="grid gap-6 lg:grid-cols-2">
          <section class="flex flex-col gap-3">
            <div class="flex items-center justify-between gap-3">
              <h2 class="text-xs uppercase tracking-wider text-zinc-500">corpus</h2>
              <label
                class="cursor-pointer rounded-md border border-zinc-700 px-3 py-1.5 text-xs text-zinc-400 transition hover:border-zinc-500 hover:text-zinc-200"
              >
                Load file
                <input id="corpus-file" type="file" accept=".txt,.text,.md,.csv" class="hidden" />
              </label>
            </div>
            <textarea
              id="corpus-input"
              class="min-h-64 flex-1 resize-y rounded-xl border border-zinc-800/80 bg-zinc-900/40 p-4 text-sm leading-relaxed text-zinc-200 outline-none focus:border-amber-500/50"
              placeholder="Paste arbitrary text here…"
              spellcheck="false"
            ></textarea>
          </section>

          <section class="flex flex-col gap-3">
            <div class="flex items-center justify-between gap-3">
              <h2 class="text-xs uppercase tracking-wider text-zinc-500">word list</h2>
              <div class="flex gap-2">
                <button
                  id="copy-wordlist"
                  type="button"
                  class="rounded-md border border-zinc-700 px-3 py-1.5 text-xs text-zinc-400 transition hover:border-zinc-500 hover:text-zinc-200"
                >
                  Copy
                </button>
                <button
                  id="download-wordlist"
                  type="button"
                  class="rounded-md border border-zinc-700 px-3 py-1.5 text-xs text-zinc-400 transition hover:border-zinc-500 hover:text-zinc-200"
                >
                  Download
                </button>
              </div>
            </div>
            <textarea
              id="wordlist-output"
              readonly
              class="min-h-64 flex-1 resize-y rounded-xl border border-zinc-800/80 bg-zinc-900/40 p-4 text-sm leading-relaxed text-zinc-300 outline-none"
              placeholder="Filtered words appear here, space-separated…"
              spellcheck="false"
            ></textarea>
          </section>
        </div>

        <section class="rounded-xl border border-zinc-800/80 bg-zinc-900/40 p-5">
          <h2 class="text-xs uppercase tracking-wider text-zinc-500">options</h2>
          <div class="mt-4 flex flex-wrap gap-x-6 gap-y-3 text-sm">
            <label class="flex cursor-pointer items-center gap-2">
              <input id="opt-lowercase" type="checkbox" checked class="accent-amber-400" />
              Lowercase
            </label>
            <label class="flex cursor-pointer items-center gap-2">
              <input id="opt-strip-punctuation" type="checkbox" checked class="accent-amber-400" />
              Strip punctuation
            </label>
            <label class="flex cursor-pointer items-center gap-2">
              <input id="opt-remove-numbers" type="checkbox" class="accent-amber-400" />
              Remove numbers
            </label>
            <label class="flex items-center gap-2">
              <span class="text-zinc-500">Min length</span>
              <input
                id="opt-min-length"
                type="number"
                min="1"
                max="32"
                value="1"
                class="w-16 rounded border border-zinc-700 bg-zinc-950 px-2 py-1 text-sm text-zinc-200 outline-none focus:border-amber-500/50"
              />
            </label>
          </div>

          <div class="mt-6 border-t border-zinc-800/80 pt-5">
            <h3 class="text-xs uppercase tracking-wider text-zinc-500">filter</h3>
            <div class="mt-3 flex flex-wrap items-center gap-4 text-sm">
              <label class="flex cursor-pointer items-center gap-2">
                <input
                  id="filter-all"
                  name="filter-mode"
                  type="radio"
                  value="all"
                  checked
                  class="accent-amber-400"
                />
                All unique words
              </label>
              <label class="flex cursor-pointer items-center gap-2">
                <input
                  id="filter-top-n"
                  name="filter-mode"
                  type="radio"
                  value="top-n"
                  class="accent-amber-400"
                />
                Top
                <input
                  id="filter-top-n-value"
                  type="number"
                  min="1"
                  value="200"
                  class="w-20 rounded border border-zinc-700 bg-zinc-950 px-2 py-1 text-sm text-zinc-200 outline-none focus:border-amber-500/50"
                />
                words
              </label>
              <label class="flex cursor-pointer items-center gap-2">
                <input
                  id="filter-top-percent-rank"
                  name="filter-mode"
                  type="radio"
                  value="top-percent-rank"
                  class="accent-amber-400"
                />
                Top
                <input
                  id="filter-top-percent-rank-value"
                  type="number"
                  min="1"
                  max="100"
                  value="10"
                  class="w-16 rounded border border-zinc-700 bg-zinc-950 px-2 py-1 text-sm text-zinc-200 outline-none focus:border-amber-500/50"
                />
                % by rank
              </label>
              <label class="flex cursor-pointer items-center gap-2">
                <input
                  id="filter-top-percent-coverage"
                  name="filter-mode"
                  type="radio"
                  value="top-percent-coverage"
                  class="accent-amber-400"
                />
                Top
                <input
                  id="filter-top-percent-coverage-value"
                  type="number"
                  min="1"
                  max="100"
                  value="90"
                  class="w-16 rounded border border-zinc-700 bg-zinc-950 px-2 py-1 text-sm text-zinc-200 outline-none focus:border-amber-500/50"
                />
                % by coverage
              </label>
            </div>
          </div>

          <div class="mt-6 flex justify-end border-t border-zinc-800/80 pt-5">
            <button
              id="apply-options"
              type="button"
              class="rounded-md border border-amber-500/60 px-4 py-2 text-sm text-amber-400 transition hover:border-amber-400 hover:text-amber-300"
            >
              Apply
            </button>
          </div>
        </section>

        <section class="rounded-xl border border-zinc-800/80 bg-zinc-900/40 p-5">
          <div class="flex flex-wrap items-baseline justify-between gap-3">
            <h2 class="text-xs uppercase tracking-wider text-zinc-500">unique words</h2>
            <p id="corpus-stats" class="text-xs tabular-nums text-zinc-600">
              0 tokens · 0 unique · 0 shown
            </p>
          </div>
          <div class="mt-4 max-h-80 overflow-y-auto rounded-lg border border-zinc-800/60">
            <table class="w-full text-left text-sm tabular-nums">
              <thead class="sticky top-0 bg-zinc-900/95 text-xs uppercase tracking-wider text-zinc-500">
                <tr>
                  <th class="px-3 py-2 font-medium">#</th>
                  <th class="px-3 py-2 font-medium">word</th>
                  <th class="px-3 py-2 font-medium">count</th>
                </tr>
              </thead>
              <tbody id="words-table-body" class="text-zinc-300"></tbody>
            </table>
            <p id="words-table-empty" class="px-3 py-8 text-center text-sm text-zinc-500">
              Paste or load a corpus, adjust options, then click Apply.
            </p>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
